name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate brand packs
        run: for f in fixtures/*/brand.md brands/*/brand.md; do node lib/brand.ts "$f"; done
      - name: Check committed fonts
        run: node lib/check-fonts.ts
      - name: Validate plugin
        run: npx --yes @anthropic-ai/claude-code plugin validate . --strict
